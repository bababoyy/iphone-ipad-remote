name: Build VCRemote dylib
on:
  push:
    branches: [main, experiment/virtual-gamepad, experiment/ble-link, experiment/native-uikit]
  workflow_dispatch:
    inputs:
      macos_runner:
        description: macOS runner (use macos-15-intel when arm64 runners are out of capacity)
        type: choice
        options: [macos-15, macos-15-intel]
        default: macos-15
jobs:
  layout:
    # Cheap Linux job: layout.json schema, golden coordinates and SVG checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and embed layout.json
        run: python3 scripts/embed_layout.py
      - name: Golden layout coordinates
        run: python3 tests/test_layout.py
      - name: Layout preview check (no new clipping/overlap)
        run: python3 scripts/render_layout_svg.py --check --hit --out-dir build/layout-preview
      - uses: actions/upload-artifact@v4
        with:
          name: layout-preview
          path: build/layout-preview
          if-no-files-found: error
  build:
    runs-on: ${{ inputs.macos_runner || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check controller protocol and JS syntax
        run: python3 scripts/check_controller.py
      - name: Check BLE source and packet contract
        run: python3 scripts/test_ble_contract.py
      - name: Embed controller page
        run: python3 scripts/embed.py
      - name: Compile iOS arm64
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang++ -arch arm64 -isysroot "$SDK" \
            -miphoneos-version-min=15.0 -std=c++17 -fobjc-arc -fobjc-weak \
            -O2 -dynamiclib -framework Foundation -framework UIKit \
            -framework CoreFoundation -framework GameController -framework CoreBluetooth \
            receiver/VCRemote.mm receiver/TouchBridge.mm receiver/VirtualGamepad.mm receiver/BLEReceiver.mm \
            -Wl,-install_name,@rpath/VCRemote.dylib -o VCRemote.dylib
          codesign --force --sign - VCRemote.dylib
          file VCRemote.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: VCRemote-arm64
          path: VCRemote.dylib
          if-no-files-found: error
  iphone-ipa:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/experiment/ble-link' || github.ref == 'refs/heads/experiment/native-uikit'
    runs-on: ${{ inputs.macos_runner || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check native controller source invariants
        run: |
          python3 scripts/check_native_controller.py
          python3 scripts/test_ble_contract.py
      - name: Build unsigned iPhone IPA
        run: bash scripts/build_ble_ipa.sh
      - name: Check unsigned IPA contents
        run: python3 scripts/inspect_ipa.py
      - uses: actions/upload-artifact@v4
        with:
          name: VCRemoteNative-unsigned
          path: build/ipa/VCRemoteNative-unsigned.ipa
          if-no-files-found: error
