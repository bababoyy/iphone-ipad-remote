<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>VCRemote</title><style>
*{box-sizing:border-box}body{margin:0;background:#111729;color:white;font-family:-apple-system,system-ui;overflow:hidden;touch-action:none}button,input,textarea{font:inherit}header{height:48px;padding:5px 12px;background:#25314c;display:flex;align-items:center;justify-content:space-between;gap:8px}header strong{color:#f5a4d2}#status{font-size:12px;color:#fcd34d}#inputMode{background:#1b2740;color:white;border:1px solid #677b9c;border-radius:7px;font-size:12px;padding:5px;max-width:135px}button{background:#34476c;color:white;border:1px solid #677b9c;border-radius:9px;padding:8px}main{height:calc(100dvh - 48px);display:flex;align-items:center;justify-content:space-evenly;gap:3px;padding:5px;user-select:none;-webkit-user-select:none}.zone{flex:1;display:flex;align-items:center;justify-content:center;min-width:60px}.stick{width:min(37vh,160px);height:min(37vh,160px);border:2px solid #75849f;background:#29354b;border-radius:50%;position:relative;touch-action:none}.stick:after{content:"";position:absolute;inset:30%;background:#8ba6cf;border-radius:50%;transform:translate(var(--dx,0px),var(--dy,0px));pointer-events:none}#actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:115px;max-width:180px;flex:1}.action{border-radius:50%;aspect-ratio:1;font-size:12px;font-weight:bold}.action.down{background:#a74285}#overlay,#settings{position:fixed;z-index:4;top:50%;left:50%;transform:translate(-50%,-50%);width:min(92vw,440px);padding:16px;background:#1e2941;border:1px solid #677b9c;border-radius:14px;box-shadow:0 0 90px #000b}#overlay input,#settings textarea{width:100%;background:#101729;border:1px solid #687da0;border-radius:6px;color:#fff;padding:9px}#settings{display:none}#settings textarea{height:35vh;touch-action:pan-y}#error{font-size:12px;color:#fca5a5}body.connected #overlay{display:none}body:not(.connected) main{opacity:.25;pointer-events:none}@media(orientation:portrait){.stick{width:25vw;height:25vw}#actions{grid-template-columns:1fr;max-width:68px}.action{font-size:10px}}
</style></head><body><header><strong>VICE CITY · REMOTE</strong><span id="status">Bağlı değil</span><select id="inputMode" aria-label="Girdi modu"><option value="touch">Touch</option><option value="gamepad">Virtual Gamepad</option></select><button id="settingsButton">⚙ Ayarlar</button></header><main><div class="zone"><div class="stick" id="move"></div></div><div id="actions"><button class="action" data-action="fire">FIRE</button><button class="action" data-action="action">ACTION</button><button class="action" data-action="sprint">SPRINT</button><button class="action" data-action="brake">BRAKE</button></div><div class="zone"><div class="stick" id="look"></div></div></main><section id="overlay"><h3>iPad'e bağlan</h3><p>GTA Vice City ekranındaki PIN'i gir.</p><input id="pin" type="tel" maxlength="6" placeholder="6 haneli PIN"><button id="join">Bağlan</button><p id="error"></p></section><section id="settings"><h3>Dokunmatik koordinatlar</h3><p>Her alan 0 ile 1 arasında x/y oranıdır. Analoglar için r yarıçapıdır.</p><textarea id="json" spellcheck="false"></textarea><button id="save">Kaydet</button><button id="reset">Sıfırla</button><button id="close">Kapat</button><p id="jsonError"></p></section><script>
(function(){'use strict';
var original={move:{x:.16,y:.76,r:.08},look:{x:.65,y:.47,r:.09},fire:{x:.90,y:.66},action:{x:.81,y:.56},sprint:{x:.87,y:.82},brake:{x:.73,y:.82}};
var layout;try{layout=JSON.parse(localStorage.getItem('vc-remote-layout'))||original}catch(e){layout=original}
var ids={move:1,look:2,fire:3,action:4,sprint:5,brake:6},active={},ws=null,mode='touch';
function el(id){return document.getElementById(id)}
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function send(name,phase,x,y){if(!ws||ws.readyState!==1)return;
if(mode==='gamepad'){
 var c=layout[name],analog=name==='move'||name==='look';
 var gx=analog?(phase==='e'?0:clamp((x-c.x)/(c.r||1),-1,1)):(phase==='e'?0:1);
 var gy=analog?(phase==='e'?0:clamp(-(y-c.y)/(c.r||1),-1,1)):0;
 ws.send('G,'+ids[name]+','+phase+','+gx.toFixed(4)+','+gy.toFixed(4));
}else{
 ws.send('T,'+ids[name]+','+phase+','+clamp(x,0,1).toFixed(4)+','+clamp(y,0,1).toFixed(4));
}}
function release(){Object.keys(active).forEach(function(name){var a=active[name];send(name,'e',a.x,a.y);delete active[name]});document.querySelectorAll('.stick').forEach(function(e){e.style.setProperty('--dx','0px');e.style.setProperty('--dy','0px')});document.querySelectorAll('.action').forEach(function(e){e.classList.remove('down')})}
function join(){var pin=el('pin').value.trim();if(!/^\d{6}$/.test(pin)){el('error').textContent='Altı rakam gir.';return}if(ws)ws.close();ws=new WebSocket('ws://'+location.host+'/ws?pin='+pin);el('status').textContent='Bağlanıyor';ws.onopen=function(){document.body.classList.add('connected');el('status').textContent='Touch bağlı';mode='touch';el('inputMode').value='touch';ws.send('M,t')};ws.onclose=function(){release();document.body.classList.remove('connected');el('status').textContent='Bağlantı kesildi';el('error').textContent='PIN veya bağlantıyı kontrol et.'}}
el('join').onclick=join;
el('inputMode').onchange=function(){
 release();mode=this.value;
 if(ws&&ws.readyState===1){ws.send('M,'+(mode==='gamepad'?'g':'t'));}
 el('status').textContent=mode==='gamepad'?'Virtual Gamepad (deney)':'Touch';
};
function stick(name){var element=el(name);element.addEventListener('pointerdown',function(e){if(active[name])return;e.preventDefault();element.setPointerCapture(e.pointerId);var c=layout[name];active[name]={pointer:e.pointerId,x:c.x,y:c.y};send(name,'b',c.x,c.y);move(e)});function move(e){var a=active[name];if(!a||a.pointer!==e.pointerId)return;e.preventDefault();var r=element.getBoundingClientRect(),rad=Math.min(r.width,r.height)/2;var dx=(e.clientX-r.left-r.width/2)/rad,dy=(e.clientY-r.top-r.height/2)/rad,len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len}element.style.setProperty('--dx',dx*rad*.5+'px');element.style.setProperty('--dy',dy*rad*.5+'px');var c=layout[name];a.x=c.x+dx*c.r;a.y=c.y+dy*c.r;send(name,'m',a.x,a.y)}element.addEventListener('pointermove',move);function end(e){var a=active[name];if(!a||a.pointer!==e.pointerId)return;send(name,'e',a.x,a.y);delete active[name];element.style.setProperty('--dx','0px');element.style.setProperty('--dy','0px')}['pointerup','pointercancel','lostpointercapture'].forEach(function(t){element.addEventListener(t,end)})}
stick('move');stick('look');
document.querySelectorAll('.action').forEach(function(button){var name=button.dataset.action;button.addEventListener('pointerdown',function(e){if(active[name])return;button.setPointerCapture(e.pointerId);var c=layout[name];active[name]={pointer:e.pointerId,x:c.x,y:c.y};button.classList.add('down');send(name,'b',c.x,c.y)});function end(e){var a=active[name];if(!a||a.pointer!==e.pointerId)return;send(name,'e',a.x,a.y);delete active[name];button.classList.remove('down')}['pointerup','pointercancel','lostpointercapture'].forEach(function(t){button.addEventListener(t,end)})});
function valid(c){return Object.keys(original).every(function(k){return c[k]&&Object.keys(original[k]).every(function(v){return typeof c[k][v]==='number'&&Number.isFinite(c[k][v])&&c[k][v]>=0&&c[k][v]<=1})})}
el('settingsButton').onclick=function(){release();el('json').value=JSON.stringify(layout,null,2);el('settings').style.display='block'};el('save').onclick=function(){try{var c=JSON.parse(el('json').value);if(!valid(c))throw Error('0–1 arası koordinat gir.');layout=c;localStorage.setItem('vc-remote-layout',JSON.stringify(c));el('settings').style.display='none'}catch(e){el('jsonError').textContent=e.message}};el('reset').onclick=function(){layout=JSON.parse(JSON.stringify(original));el('json').value=JSON.stringify(layout,null,2);localStorage.removeItem('vc-remote-layout')};el('close').onclick=function(){el('settings').style.display='none'};document.addEventListener('visibilitychange',function(){if(document.hidden)release()});window.addEventListener('pagehide',release);window.addEventListener('blur',release);setInterval(function(){if(ws&&ws.readyState===1)ws.send('P')},2000);
})();
</script></body></html>
